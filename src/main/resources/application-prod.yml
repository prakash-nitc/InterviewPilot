# ========================
# InterviewPilot — Production Configuration
# Activated with: --spring.profiles.active=prod
# ========================

spring:
  # PostgreSQL Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:interviewpilot}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:interviewpilot}
    password: ${DB_PASSWORD:interviewpilot}

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # Disable H2 console in production
  h2:
    console:
      enabled: false

  # Enable Thymeleaf caching in production
  thymeleaf:
    cache: true

# Server
server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: always
